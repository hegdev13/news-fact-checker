[project]
name = "newsfact"
version = "0.2.0"
description = "Multi-agent news fact-checker & polarization analyzer (v2: 5 agents + live terminal dashboard)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
newsfact = "newsfact.main:cli"
newsfact-server = "newsfact.web:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
newsfact = ["resources/*.json", "resources/*.txt"]
